name: Publish to Modrinth
on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip Datapack
        run: zip -r Grid.zip . -x ".github/*" ".git/*" "*.yml" "README.md" # Package your files into a .zip

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2 # Use the official or a trusted community action
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: "uOme8XHr"
          version: ${{ github.event.release.tag_name }}
          name: "${{ github.event.release.release_name }}"
          files: "Grid.zip"
          loaders: "datapack" # Specifically mark as a datapack
          game-versions: |- # Update based on supported 2026 versions
            26.1-snapshot-3
            26.1-snapshot-4
          changelog: ${{ github.release.body }}
          channel: "release"
