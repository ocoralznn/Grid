name: Publish to Modrinth
on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update pack version
        run: |
          jq --arg version "${{ github.event.release.tag_name }}" '.pack.description[7].text = $version' pack.mcmeta > pack.mcmeta.tmp && mv pack.mcmeta.tmp pack.mcmeta

      - name: Zip Datapack
        run: zip -r Grid-DP_v${{ github.event.release.tag_name }}.zip . -x ".github/*" ".git/*" "*.yml" "README.md" # Package files into .zip

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: "uOme8XHr"
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          files: "Grid-DP_v${{ github.event.release.tag_name }}.zip"
          loaders: "datapack"
          game-versions: |-
            26.2
          channel: "release"

      - name: Send Discord notification
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"${{ github.event.release.body }}\",
              \"embeds\": [],
              \"components\": [
                {
                  \"type\": 1,
                  \"components\": [
                    {
                      \"type\": 2,
                      \"style\": 5,
                      \"label\": \"Download\",
                      \"url\": \"https://modrinth.com/datapack/grid-from-choir/\",
                      \"disabled\": false,
                      \"emoji\": {
                        \"name\": \"📦\"
                      }
                    }
                  ]
                }
              ],
              \"thread_name\": \"${{ github.event.release.name }}\"
            }"
