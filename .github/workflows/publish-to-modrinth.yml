name: Publish to Modrinth

on:
  push:
    tags:
      - 'v*.*.*' # Triggers the workflow when a tag like v1.0.0 is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Add steps here to build your project and generate the final mod file (e.g., a .jar file)
      # For example, using Maven:
      # - name: Build project with Maven
      #   run: mvn clean install

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3 # Or another similar action like cloudnode-pro/modrinth-publish
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # The project ID from Modrinth (can be a secret or hardcoded)
          modrinth-project: ${{ secrets.MODRINTH_PROJECT_ID }} 
          # The file generated by your build process
          files: |
            ./target/*.jar 
          # The version name will be inferred from the GitHub Release tag
          # You will need to specify other required metadata like loaders and game versions
          loaders: "fabric,forge" # Example loaders
          game-versions: "1.20.1,1.20.4" # Example game versions
          changelog: ${{ github.event.release.body }} # Use the GitHub release description as changelog
